name: scrape-deals

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC (09:17 Sofia summer time)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ".[browser]" && playwright install --with-deps chromium
      # The DB (price history, notified flags) and the BestSecret session persist between runs via the cache.
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: luxdeals-data-${{ github.run_id }}
          restore-keys: luxdeals-data-
      - run: luxdeals run --browser
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          BESTSECRET_EMAIL: ${{ secrets.BESTSECRET_EMAIL }}
          BESTSECRET_PASSWORD: ${{ secrets.BESTSECRET_PASSWORD }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: luxdeals-data-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: deals-page
          path: site/index.html
