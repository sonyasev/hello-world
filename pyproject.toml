[project]
name = "luxdeals"
version = "0.1.0"
description = "Finds great deals on luxury clothes across online stores that ship to Bulgaria"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "PyYAML>=6", "Jinja2>=3.1"]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
luxdeals = "luxdeals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
